# --- shiroikuma-sokki fork ---------------------------------------------------------------
# Our per-build counter N. `buildFork` bumps it after every successful build; the
# /upstream-new-version skill resets it to 1 on every upstream sync, so "+N" always reads as
# "our Nth build on this upstream base". Consumed by app/build.gradle.kts:
#   versionName = "<upstream>+NNN"   versionCode = <upstream code> * 10000 + N
BUILD_NUMBER=5
